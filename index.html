<body>
  <section class="auth-gate" id="authGate" aria-labelledby="authTitle">
    <form class="auth-card" id="signInForm">
      <h1 id="authTitle">เข้าสู่ระบบ Hugcode</h1>
      <p>ลงชื่อเข้าใช้เพื่อดูและบันทึกบอร์ดงานของทีม</p>
      <label for="authEmail">อีเมล</label>
      <input id="authEmail" type="email" autocomplete="username" required>
      <label for="authPassword">รหัสผ่าน</label>
      <input id="authPassword" type="password" autocomplete="current-password" required>
      <p class="auth-error" id="authError" role="alert" hidden></p>
      <button class="primary" id="signInButton" type="submit">เข้าสู่ระบบ</button>
    </form>
  </section>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5.5h14M5 11.5h14M5 17.5h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m17 16 2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1>Hugcode</h1><p>Team Workboard · ภาพรวมงานของทีม</p></div></div>
      <div class="auth-actions"><span id="syncStatus" role="status">กำลังเชื่อมต่อ...</span><button class="secondary" id="signOutButton" type="button" hidden>ออกจากระบบ</button></div>
    </header>
    <section class="toolbar" aria-label="เครื่องมือบอร์ด">
      <div class="toolbar-left"><div class="search-filter"><span class="filter-label">ค้นหา</span><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="ค้นหา..." aria-label="ค้นหา..."></label></div><label class="filter assignee-filter"><span class="filter-label">ผู้รับผิดชอบ</span><select id="assigneeFilter" aria-label="กรองตามผู้รับผิดชอบ"><option value="all">--เลือก--</option></select></label><div class="filter assigned-date-filter"><label class="filter-label" for="assignedDateFilter">วันที่</label><div class="date-control filter-date-control"><input id="assignedDateFilter" class="filter-date-display" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy" aria-label="ค้นหาตามวันที่มอบหมายหรือกำหนดส่ง"><button type="button" id="assignedFilterCalendarButton" class="calendar-button" aria-label="เลือกวันที่">▦</button><input id="assignedDateFilterPicker" class="native-date-picker" type="date" aria-label="เลือกวันที่"></div></div><div class="filter-action-buttons"><button type="button" id="applyFilters" class="primary search-action">ค้นหา</button><button type="button" id="clearFilters" class="secondary">ล้างค่า</button></div><button type="button" class="secondary export-button" id="exportExcel" aria-label="Export Excel" title="Export Excel"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#217346" d="M4 3h11l5 5v13H4z"/><path fill="#185c37" d="M15 3v5h5"/><path fill="#fff" d="M7.1 10h1.7l1.3 2.1 1.3-2.1h1.7l-2.1 3.1 2.2 3.2h-1.8l-1.3-2.2-1.4 2.2H7l2.2-3.2z"/></svg></button></div>
      <div class="stats"><span class="github-state" id="githubState">● ตัวอย่างในเครื่อง</span><strong id="totalCount">0</strong> งานทั้งหมด <span>·</span> <span id="activeCount">0</span> งานที่กำลังดำเนินการ</div>
    </section>
    <section class="board" id="board" aria-label="บอร์ดติดตามงาน"></section>
  </main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <form class="dialog" id="taskForm"><div class="dialog-head"><h2 id="dialogTitle">เพิ่มงานใหม่</h2><button type="button" class="close" id="closeDialog" aria-label="ปิด">×</button></div>
      <div class="form-row"><label for="title">ชื่องาน</label><input id="title" name="title" required maxlength="110"></div>
      <div class="form-row"><label for="moduleNameTrigger">ชื่อโมดูล</label><div class="category-picker"><button type="button" id="moduleNameTrigger" class="picker-trigger" aria-haspopup="listbox" aria-expanded="false">--เลือก-- <span>⌄</span></button><input id="moduleName" name="moduleName" type="hidden"><div class="category-options picker-panel" id="moduleNameOptions" role="listbox" hidden><input id="moduleNameSearch" class="picker-search" type="search" autocomplete="off" placeholder="ค้นหา..." aria-label="ค้นหาชื่อโมดูล"><div id="moduleNameOptionList"></div></div></div><div class="option-managers"><button type="button" data-module-action="add">＋ เพิ่ม</button><button type="button" data-module-action="edit">✎ แก้ไข</button><button type="button" data-module-action="delete">× ลบ</button></div></div>
      <div class="form-row"><label for="description">รายละเอียด <span style="font-weight:400;color:#98a1ae">(ไม่บังคับ)</span></label><textarea id="description" name="description"></textarea></div>
      <div class="form-row"><label for="taskTagsInput">แท็กย่อย <span style="font-weight:400;color:#98a1ae">(คั่นแต่ละแท็กด้วยจุลภาค)</span></label><input id="taskTagsInput" name="taskTags" type="text" autocomplete="off"></div>
      <div class="form-grid"><div class="form-row"><label for="assigneeTrigger">ผู้รับผิดชอบ</label><div class="category-picker"><button type="button" id="assigneeTrigger" class="picker-trigger" aria-haspopup="listbox" aria-expanded="false">--เลือก-- <span>⌄</span></button><input id="assignee" name="assignee" type="hidden"><div class="category-options picker-panel people-options" id="assigneeOptions" role="listbox" hidden><input id="assigneeSearch" class="picker-search" type="search" autocomplete="off" placeholder="ค้นหา..." aria-label="ค้นหา..."><div id="assigneeOptionList"></div></div></div><div class="option-managers"><button type="button" data-person-action="add">＋ เพิ่ม</button><button type="button" data-person-action="edit">✎ แก้ไข</button><button type="button" data-person-action="delete">× ลบ</button></div></div><div class="form-row"><label for="assignerTrigger">ผู้มอบหมาย</label><div class="category-picker"><button type="button" id="assignerTrigger" class="picker-trigger" aria-haspopup="listbox" aria-expanded="false">--เลือก-- <span>⌄</span></button><input id="assigner" name="assigner" type="hidden"><div class="category-options picker-panel people-options" id="assignerOptions" role="listbox" hidden><input id="assignerSearch" class="picker-search" type="search" autocomplete="off" placeholder="ค้นหา..." aria-label="ค้นหาผู้มอบหมาย"><div id="assignerOptionList"></div></div></div><div class="option-managers"><button type="button" data-assigner-action="add">＋ เพิ่ม</button><button type="button" data-assigner-action="edit">✎ แก้ไข</button><button type="button" data-assigner-action="delete">× ลบ</button></div></div></div>

<script>
  (()=>{
    const board=document.getElementById('board');
    function enhanceCards(){
      board.querySelectorAll('.task').forEach(card=>{card.draggable=true;card.dataset.taskId=card.querySelector('[data-id]')?.dataset.id||card.querySelector('[data-edit-id]')?.dataset.editId||card.dataset.taskId||'';const menu=card.querySelector('.move-menu');if(menu&&!menu.querySelector('.delete-task')){const button=document.createElement('button');button.type='button';button.className='delete-task';button.textContent='ลบงาน';button.dataset.deleteId=card.dataset.taskId;menu.append(button)}});
    }
    const observer=new MutationObserver(enhanceCards);observer.observe(board,{childList:true,subtree:true});enhanceCards();
    document.addEventListener('click',event=>{
      const clickedMenu=event.target.closest('.task-actions');
      document.querySelectorAll('.task-actions[open]').forEach(menu=>{
        if(menu!==clickedMenu)menu.removeAttribute('open');
      });
    });
    board.addEventListener('dragstart',event=>{const card=event.target.closest('.task');if(!card)return;card.classList.add('dragging');event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',card.dataset.taskId)});
    board.addEventListener('dragend',event=>{event.target.closest('.task')?.classList.remove('dragging');board.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))});
    board.addEventListener('dragover',event=>{const col=event.target.closest('.column');if(!col)return;event.preventDefault();event.dataTransfer.dropEffect='move';col.classList.add('drag-over')});
    board.addEventListener('dragleave',event=>{const col=event.target.closest('.column');if(col&&!col.contains(event.relatedTarget))col.classList.remove('drag-over')});
    board.addEventListener('drop',event=>{const col=event.target.closest('.column'),id=event.dataTransfer.getData('text/plain');if(!col||!id)return;event.preventDefault();col.classList.remove('drag-over');const task=tasks.find(t=>String(t.id)===id);if(task&&task.status!==col.dataset.column){const previousStatus=task.status;task.status=col.dataset.column;if(task.status==='done'&&previousStatus!=='done')task.completedAt=new Date().toISOString();else if(previousStatus==='done'&&task.status!=='done')delete task.completedAt;save()}});
    board.addEventListener('click',event=>{const button=event.target.closest('[data-delete-id]');if(!button)return;const id=button.dataset.deleteId,task=tasks.find(t=>String(t.id)===id);if(task&&confirm(`ลบงาน “${task.title}” ใช่หรือไม่?`)){tasks=tasks.filter(t=>String(t.id)!==id);try{localStorage.setItem('team-workboard-v1',JSON.stringify(tasks));render()}catch(error){alert('บันทึกการลบไม่ได้ เบราว์เซอร์อาจปิดการจัดเก็บข้อมูลไว้')}}});
  })();
</script>
