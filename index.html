<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8fb" />
  <title>ติดตามงานทีม | Workboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"IBM Plex Sans Thai",Inter,system-ui,sans-serif;color:#233148;background:#f7f8fb;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-width:340px;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:36px 42px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{height:42px;width:42px;border-radius:13px;display:grid;place-items:center;background:#355bea;color:white;box-shadow:0 6px 15px #355bea30}.brand-mark svg{width:23px}.brand h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.4px}.brand p{font-size:12px;color:#8993a4;margin:1px 0 0}.top-actions{display:flex;align-items:center;gap:10px}.period{font-size:13px;color:#737f92;background:#fff;border:1px solid #e8ebf0;border-radius:9px;padding:9px 13px}.avatar-group{display:flex;align-items:center;padding-left:7px}.avatar{width:31px;height:31px;margin-left:-7px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#354660;background:#dfe7ff}.avatar:nth-child(2){background:#ffebd5;color:#a96320}.avatar:nth-child(3){background:#d9f2e9;color:#318369}.avatar.more{background:#f0f1f4;color:#768196}.primary{border:0;border-radius:9px;background:#355bea;color:white;padding:10px 15px;font-weight:600;box-shadow:0 5px 12px #355bea25}.primary:hover{background:#294dd6}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:35px 0 21px}.toolbar-left{display:flex;align-items:center;gap:11px}.search{position:relative}.search svg{position:absolute;width:17px;left:12px;top:11px;color:#8994a6}.search input{height:40px;width:230px;border:1px solid #e5e8ee;border-radius:9px;background:#fff;padding:0 12px 0 38px;color:#27364d;outline:none}.search input:focus,.filter select:focus{border-color:#9eb0ff;box-shadow:0 0 0 3px #355bea12}.filter select{height:40px;min-width:160px;border:1px solid #e5e8ee;border-radius:9px;background:#fff;color:#5e6a7d;padding:0 34px 0 12px;outline:none}.stats{display:flex;gap:8px;align-items:center;color:#8b95a5;font-size:12px}.stats strong{color:#34435a;font-size:15px}.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:16px;align-items:start}.column{background:#eef1f5;border:1px solid #e8ebf0;border-radius:12px;padding:12px;min-height:350px}.column-head{display:flex;justify-content:space-between;align-items:center;padding:3px 3px 11px}.column-title{display:flex;align-items:center;gap:8px;color:#718096;font-size:12px;font-weight:700;letter-spacing:.35px}.dot{width:8px;height:8px;border-radius:50%;background:#9ba6b6}.col-progress .dot{background:#5685ef}.col-review .dot{background:#d5a048}.col-done .dot{background:#46ac84}.count{font-size:11px;font-weight:600;color:#828da0;background:#e3e7ed;border-radius:99px;padding:2px 7px}.add-small{border:0;background:transparent;color:#9aa4b3;font-size:20px;line-height:1;width:26px;height:26px;border-radius:7px}.add-small:hover{background:#e4e8ef;color:#42536f}.task{background:#fff;border:1px solid #e3e8ef;border-radius:9px;padding:13px 13px 11px;margin-bottom:9px;box-shadow:0 1px 2px #24324b08;transition:transform .15s,box-shadow .15s}.task:hover{transform:translateY(-2px);box-shadow:0 6px 16px #24324b12}.task-title{font-size:14px;line-height:1.5;font-weight:600;color:#34435a;margin:0 0 11px}.project-tag{display:inline-flex;border-radius:4px;padding:3px 7px;font-size:10px;line-height:1.2;letter-spacing:.3px;font-weight:700;margin-bottom:12px;color:#3159cb;background:#edf1ff}.project-tag.purple{color:#7254b9;background:#f1eafe}.project-tag.teal{color:#238d85;background:#e1f6f2}.project-tag.orange{color:#bf7624;background:#fff0dc}.project-tag.rose{color:#bd5e74;background:#ffebf0}.task-footer{display:flex;align-items:center;gap:8px}.priority{font-size:11px;font-weight:600;color:#8792a3}.priority.high{color:#df6a5f}.priority.low{color:#68a78f}.due{font-size:10px;color:#8792a3;margin-left:auto;white-space:nowrap}.assignee{height:27px;width:27px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#536681;background:#e4eafd}.assignee.a2{background:#ffe7d5;color:#b27441}.assignee.a3{background:#ddf1e6;color:#38825e}.assignee.a4{background:#f7e1ee;color:#a2517d}.assignee.a5{background:#e9e3fb;color:#7055aa}.task-actions{position:relative;margin-left:2px}.task-actions summary{list-style:none;cursor:pointer;color:#a0a9b6;font-size:19px;line-height:20px}.task-actions summary::-webkit-details-marker{display:none}.move-menu{position:absolute;z-index:4;right:0;top:22px;background:#fff;border:1px solid #e5e8ef;border-radius:8px;padding:5px;box-shadow:0 8px 22px #26334a20;min-width:145px}.move-menu button{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:5px;color:#526075;padding:7px;font-size:12px}.move-menu button:hover{background:#f3f5f9}.empty{color:#9aa4b2;text-align:center;padding:42px 12px;font-size:12px}.empty[hidden]{display:none}.overlay{position:fixed;inset:0;background:#17243c55;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay.open{display:flex}.dialog{width:min(470px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:0 20px 60px #18233a30}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog h2{font-size:18px;margin:0}.close{border:0;background:#f2f4f7;color:#707d90;border-radius:7px;width:30px;height:30px;font-size:18px}.form-row{margin-bottom:13px}.form-row label{display:block;font-size:12px;color:#657287;font-weight:600;margin-bottom:5px}.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid #e3e7ee;border-radius:8px;padding:9px 10px;outline:none;color:#34435a;background:#fff}.form-row textarea{resize:vertical;min-height:70px}.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#9eb0ff;box-shadow:0 0 0 3px #355bea12}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.secondary{border:1px solid #e3e7ee;background:#fff;color:#68758a;border-radius:8px;padding:9px 14px}.mobile-label{display:none}
    @media(max-width:1050px){.shell{padding:28px 24px}.board{grid-template-columns:repeat(2,minmax(230px,1fr))}}@media(max-width:600px){.shell{padding:22px 14px 36px}.brand h1{font-size:19px}.brand p{font-size:11px}.brand-mark{width:37px;height:37px}.period,.avatar-group{display:none}.toolbar{margin:25px 0 16px;align-items:flex-start;flex-direction:column}.toolbar-left{width:100%}.search{flex:1}.search input{width:100%}.filter select{min-width:125px}.stats{align-self:flex-end}.board{grid-template-columns:1fr;gap:12px}.column{min-height:initial}.column:not(:has(.task:not([hidden]))){display:none}.task{padding:12px}.mobile-label{display:inline}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5.5h14M5 11.5h14M5 17.5h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m17 16 2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1>ติดตามงานทีม</h1><p>Team Workboard · ภาพรวมงานของทีม</p></div></div>
      <div class="top-actions"><span class="period">GitHub Issues · Projects</span><div class="avatar-group" aria-label="สมาชิกทีม"><span class="avatar">นพ</span><span class="avatar">มล</span><span class="avatar">กฤ</span><span class="avatar more">+2</span></div><button class="primary" id="newTask"><span>＋</span> เพิ่มงาน</button></div>
    </header>
    <section class="toolbar" aria-label="เครื่องมือบอร์ด">
      <div class="toolbar-left"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="ค้นหางานหรือชื่อลูกน้อง..." aria-label="ค้นหางาน"></label><label class="filter"><select id="assigneeFilter" aria-label="กรองตามผู้รับผิดชอบ"><option value="all">สมาชิกทั้งหมด</option><option value="นภัส">นภัส</option><option value="มะลิ">มะลิ</option><option value="กฤต">กฤต</option><option value="พิม">พิม</option><option value="ต้น">ต้น</option></select></label></div>
      <div class="stats"><span class="github-state" id="githubState">● ตัวอย่างในเครื่อง</span><strong id="totalCount">0</strong> งานทั้งหมด <span>·</span> <span id="activeCount">0</span> งานที่กำลังทำ</div>
    </section>
    <section class="board" id="board" aria-label="บอร์ดติดตามงาน"></section>
  </main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <form class="dialog" id="taskForm"><div class="dialog-head"><h2 id="dialogTitle">เพิ่มงานใหม่</h2><button type="button" class="close" id="closeDialog" aria-label="ปิด">×</button></div>
      <div class="form-row"><label for="title">ชื่องาน</label><input id="title" name="title" required maxlength="110" placeholder="เช่น สรุปผลการทำงานประจำสัปดาห์"></div>
      <div class="form-row"><label for="description">รายละเอียด <span style="font-weight:400;color:#98a1ae">(ไม่บังคับ)</span></label><textarea id="description" name="description" maxlength="240" placeholder="ระบุเป้าหมายหรือข้อมูลเพิ่มเติม"></textarea></div>
      <div class="form-grid"><div class="form-row"><label for="assignee">ผู้รับผิดชอบ</label><select id="assignee" name="assignee"><option>นภัส</option><option>มะลิ</option><option>กฤต</option><option>พิม</option><option>ต้น</option></select></div><div class="form-row"><label for="status">สถานะ</label><select id="status" name="status"><option value="todo">รอดำเนินการ</option><option value="progress">กำลังดำเนินการ</option><option value="review">รอตรวจสอบ</option><option value="done">เสร็จแล้ว</option></select></div></div>
      <div class="form-grid"><div class="form-row"><label for="project">หมวดงาน</label><select id="project" name="project"><option>งานประจำ</option><option>โปรเจกต์ A</option><option>โปรเจกต์ B</option><option>ประสานงาน</option><option>อื่น ๆ</option></select></div><div class="form-row"><label for="due">กำหนดส่ง</label><input id="due" name="due" type="date"></div></div>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancelDialog">ยกเลิก</button><button class="primary" type="submit">บันทึกงาน</button></div>
    </form>
  </div>
  <script>
    const columns=[{id:'todo',title:'รอดำเนินการ',className:'col-todo'},{id:'progress',title:'กำลังดำเนินการ',className:'col-progress'},{id:'review',title:'รอตรวจสอบ',className:'col-review'},{id:'done',title:'เสร็จแล้ว',className:'col-done'}];
    const initial=[
      {id:1,title:'จัดทำแผนงานและเป้าหมายประจำเดือน',project:'งานประจำ',assignee:'นภัส',status:'todo',due:'2026-10-02',priority:'สูง',tone:''},
      {id:2,title:'รวบรวมเอกสารเพื่อเตรียมประชุมทีม',project:'โปรเจกต์ A',assignee:'มะลิ',status:'todo',due:'2026-10-03',priority:'ปกติ',tone:'purple'},
      {id:3,title:'ติดตามความคืบหน้าจากฝ่ายที่เกี่ยวข้อง',project:'ประสานงาน',assignee:'กฤต',status:'todo',due:'2026-10-05',priority:'ปกติ',tone:'orange'},
      {id:4,title:'สรุปข้อมูลและจัดทำรายงานภาพรวม',project:'โปรเจกต์ B',assignee:'พิม',status:'todo',due:'2026-10-06',priority:'ต่ำ',tone:'teal'},
      {id:5,title:'ทบทวนรายการงานค้างและจัดลำดับความสำคัญ',project:'งานประจำ',assignee:'ต้น',status:'todo',due:'2026-10-07',priority:'ปกติ',tone:''},
      {id:6,title:'ออกแบบขั้นตอนการทำงานสำหรับโปรเจกต์ใหม่',project:'โปรเจกต์ A',assignee:'มะลิ',status:'progress',due:'2026-10-01',priority:'สูง',tone:'purple'},
      {id:7,title:'ประสานกำหนดการกับทีมและผู้เกี่ยวข้อง',project:'ประสานงาน',assignee:'นภัส',status:'progress',due:'2026-10-02',priority:'ปกติ',tone:'orange'},
      {id:8,title:'ตรวจสอบข้อมูลในระบบให้เป็นปัจจุบัน',project:'งานประจำ',assignee:'กฤต',status:'progress',due:'2026-10-04',priority:'ปกติ',tone:''},
      {id:9,title:'จัดทำร่างแผนการดำเนินงานระยะถัดไป',project:'โปรเจกต์ B',assignee:'ต้น',status:'progress',due:'2026-10-06',priority:'ต่ำ',tone:'teal'},
      {id:10,title:'ติดตามผลการส่งมอบงานและอัปเดตสถานะ',project:'งานประจำ',assignee:'พิม',status:'progress',due:'2026-10-08',priority:'ปกติ',tone:''},
      {id:11,title:'ตรวจทานรายงานสรุปก่อนนำเสนอ',project:'โปรเจกต์ B',assignee:'นภัส',status:'review',due:'2026-09-30',priority:'สูง',tone:'teal'},
      {id:12,title:'ตรวจสอบรายละเอียดแผนงานประจำเดือน',project:'งานประจำ',assignee:'มะลิ',status:'review',due:'2026-10-01',priority:'ปกติ',tone:''},
      {id:13,title:'จัดทำบันทึกการประชุมและส่งให้ทีม',project:'ประสานงาน',assignee:'กฤต',status:'done',due:'2026-09-28',priority:'ปกติ',tone:'orange'},
      {id:14,title:'รวบรวมความต้องการจากสมาชิกในทีม',project:'โปรเจกต์ A',assignee:'พิม',status:'done',due:'2026-09-26',priority:'ต่ำ',tone:'purple'},
      {id:15,title:'อัปเดตเอกสารขั้นตอนการทำงาน',project:'งานประจำ',assignee:'ต้น',status:'done',due:'2026-09-25',priority:'ปกติ',tone:''},
      {id:16,title:'สรุปผลการดำเนินงานของสัปดาห์ที่ผ่านมา',project:'งานประจำ',assignee:'นภัส',status:'done',due:'2026-09-24',priority:'ปกติ',tone:''},
      {id:17,title:'ประสานงานและยืนยันกำหนดส่งงาน',project:'ประสานงาน',assignee:'มะลิ',status:'done',due:'2026-09-23',priority:'ต่ำ',tone:'orange'},
      {id:18,title:'เตรียมข้อมูลสำหรับการประชุมทีม',project:'โปรเจกต์ B',assignee:'กฤต',status:'done',due:'2026-09-22',priority:'ปกติ',tone:'teal'},
      {id:19,title:'จัดระเบียบไฟล์งานและเอกสารส่วนกลาง',project:'งานประจำ',assignee:'พิม',status:'done',due:'2026-09-21',priority:'ต่ำ',tone:''},
      {id:20,title:'ตรวจเช็กรายการงานที่ต้องส่งประจำเดือน',project:'โปรเจกต์ A',assignee:'ต้น',status:'done',due:'2026-09-20',priority:'ปกติ',tone:'purple'}
    ];
    // GitHub Issues/Projects require authenticated API calls. The static demo stays local
    // until repository/project details and a secure backend or GitHub App are configured.
    const key='team-workboard-v1';let tasks;try{const saved=JSON.parse(localStorage.getItem(key));tasks=Array.isArray(saved)?saved:initial}catch{tasks=initial}
    const people={'นภัส':'นภ','มะลิ':'มล','กฤต':'กฤ','พิม':'พิม','ต้น':'ต้น'};const tones=['','purple','teal','orange','rose'];
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function dateLabel(value){if(!value)return'';const d=new Date(value+'T00:00:00');return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
    function render(){const q=document.getElementById('search').value.trim().toLowerCase(),person=document.getElementById('assigneeFilter').value;const filtered=tasks.filter(t=>(!q||[t.title,t.project,t.assignee,t.description].some(x=>(x||'').toLowerCase().includes(q)))&&(person==='all'||t.assignee===person));
      document.getElementById('totalCount').textContent=tasks.length;document.getElementById('activeCount').textContent=tasks.filter(t=>t.status==='progress').length;
      document.getElementById('board').innerHTML=columns.map(c=>{const rows=filtered.filter(t=>t.status===c.id);return `<section class="column ${c.className}" data-column="${c.id}"><header class="column-head"><span class="column-title"><i class="dot"></i>${c.title}<span class="count">${rows.length}</span></span><button class="add-small" data-add="${c.id}" aria-label="เพิ่มงานใน${c.title}">＋</button></header><div class="task-list">${rows.map(t=>`<article class="task"><p class="task-title" title="${esc(t.description||'')}">${esc(t.title)}</p><span class="project-tag ${esc(t.tone||'')}">${esc(t.project)}</span><div class="task-footer"><span class="priority ${t.priority==='สูง'?'high':t.priority==='ต่ำ'?'low':''}">${t.priority==='สูง'?'▲':t.priority==='ต่ำ'?'▽':'●'} ${esc(t.priority)}</span><span class="due">${t.due?'ส่ง '+dateLabel(t.due):''}</span><span class="assignee ${['มะลิ','พิม'].includes(t.assignee)?'a2':t.assignee==='กฤต'?'a3':t.assignee==='ต้น'?'a5':''}" title="${esc(t.assignee)}">${esc(people[t.assignee]||t.assignee.slice(0,2))}</span><details class="task-actions"><summary aria-label="เปลี่ยนสถานะ">···</summary><div class="move-menu">${columns.filter(x=>x.id!==t.status).map(x=>`<button data-move="${x.id}" data-id="${t.id}">ย้ายไป${x.title}</button>`).join('')}</div></details></div></article>`).join('')||'<div class="empty">ไม่มีงานในสถานะนี้</div>'}</div></section>`}).join('');
    }
    const overlay=document.getElementById('overlay'),form=document.getElementById('taskForm');function openDialog(status='todo'){form.reset();document.getElementById('status').value=status;overlay.classList.add('open');document.getElementById('title').focus()}function closeDialog(){overlay.classList.remove('open')}
    document.getElementById('newTask').addEventListener('click',()=>openDialog());document.getElementById('closeDialog').addEventListener('click',closeDialog);document.getElementById('cancelDialog').addEventListener('click',closeDialog);overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
    document.getElementById('search').addEventListener('input',render);document.getElementById('assigneeFilter').addEventListener('change',render);document.getElementById('board').addEventListener('click',e=>{const add=e.target.closest('[data-add]'),move=e.target.closest('[data-move]');if(add)openDialog(add.dataset.add);if(move){const task=tasks.find(t=>String(t.id)===move.dataset.id);if(task)task.status=move.dataset.move;save()}});
    form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form),title=fd.get('title').trim();if(!title)return;const project=fd.get('project');tasks.unshift({id:Date.now(),title,description:fd.get('description').trim(),project,assignee:fd.get('assignee'),status:fd.get('status'),due:fd.get('due'),priority:'ปกติ',tone:({'โปรเจกต์ A':'purple','โปรเจกต์ B':'teal','ประสานงาน':'orange','อื่น ๆ':'rose'})[project]||''});save();closeDialog()});
    function save(){try{localStorage.setItem(key,JSON.stringify(tasks))}catch{}render()}render();
  </script>
</body>
</html>
